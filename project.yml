targets:
  AIChatApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Under `sources`, not `resources`: XcodeGen has no `resources` target key — that is Tuist's
      # — so it was silently ignored and the asset catalog never reached the target at all. It went
      # unnoticed because the catalog held nothing but an empty Contents.json.
      - path: Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: AI Chat
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Unlock AI Chat with Face ID instead of retyping your demo passphrase.
        ITSAppUsesNonExemptEncryption: false
        OpenRouterAPIKey: $(OPENROUTER_API_KEY)
        OpenRouterSiteURL: $(OPENROUTER_SITE_URL)
        OpenRouterAppName: $(OPENROUTER_APP_NAME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajatslakhina.aichatapp
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: ProviderGatewayKit
        product: ProviderGatewayKit
      - package: TokenMeterKit
        product: TokenMeterKit
      - package: StructuredOutputKit
        product: StructuredOutputKit
      - package: ResponseCacheKit
        product: ResponseCacheKit
      - package: ToolRegistryKit
        product: ToolRegistryKit
      - package: AgentLoopKit
        product: AgentLoopKit
      - package: GuardrailKit
        product: GuardrailKit
      - package: TraceKit
        product: TraceKit
      - package: RetrievalKit
        product: RetrievalKit
      - package: PromptTemplateKit
        product: PromptTemplateKit
      - package: RetryPolicyKit
        product: RetryPolicyKit
      - package: ContextCompactionKit
        product: ContextCompactionKit
      - package: AgentMemoryKit
        product: AgentMemoryKit
      - package: SemanticRouterKit
        product: SemanticRouterKit
      - package: OutputRepairKit
        product: OutputRepairKit
      - package: StreamAggregatorKit
        product: StreamAggregatorKit
      - package: BatchInferenceKit
        product: BatchInferenceKit
      - package: RealtimeSessionKit
        product: RealtimeSessionKit
      - package: IdempotencyKit
        product: IdempotencyKit
      - package: SchemaMigrationKit
        product: SchemaMigrationKit
      - package: ToolAuthorityKit
        product: ToolAuthorityKit
      - package: GroundingKit
        product: GroundingKit
      - package: QuotaGovernorKit
        product: QuotaGovernorKit
      - package: CostEstimatorKit
        product: CostEstimatorKit
      - package: WorkloadProfilerKit
        product: WorkloadProfilerKit
      - package: ClaimConsistencyKit
        product: ClaimConsistencyKit
      - package: SourceConflictKit
        product: SourceConflictKit
      - package: ClaimSegmenterKit
        product: ClaimSegmenterKit
      - package: CitationBindingKit
        product: CitationBindingKit
      - package: ClaimDecontextualizerKit
        product: ClaimDecontextualizerKit
      - package: AnswerabilityKit
        product: AnswerabilityKit
      - package: MorphologyMatchKit
        product: MorphologyMatchKit
      - package: MorphologyMatchKit
        product: MorphologyMatchAnswerability
      - package: EvidenceSensitivityKit
        product: EvidenceSensitivityKit
      - package: EvidenceSensitivityKit
        product: EvidenceSensitivityAnswerability
      - package: SourceIndependenceKit
        product: SourceIndependenceKit
      - package: SourceIndependenceKit
        product: SourceIndependenceSensitivity
      - package: TemporalValidityKit
        product: TemporalValidityKit
      - package: TemporalValidityKit
        product: TemporalValidityAnswerability
      - package: AbstentionPolicyKit
        product: AbstentionPolicyKit
      - package: SignalDependenceKit
        product: SignalDependenceKit
      - package: SignalDependenceKit
        product: SignalDependenceAbstention
      - package: ConformalGateKit
        product: ConformalGateKit
      - package: ConformalGateKit
        product: ConformalGateAbstention
      - package: CensoredFeedbackKit
        product: CensoredFeedbackKit
      - package: CensoredFeedbackKit
        product: CensoredFeedbackConformal
      - package: ExplorationChannelKit
        product: ExplorationChannelKit
      - package: ExplorationChannelKit
        product: ExplorationChannelCensored
      - package: LabelReturnKit
        product: LabelReturnKit
      - package: LabelReturnKit
        product: LabelReturnExploration
      - package: DelaySignalKit
        product: DelaySignalKit
      - package: DelaySignalKit
        product: DelaySignalReturn
      - package: DelayShapeKit
        product: DelayShapeKit
      - package: DelayShapeKit
        product: DelayShapeSignal
      - package: DelayCurveKit
        product: DelayCurveKit
      - package: CurveDivergenceKit
        product: CurveDivergenceKit
      - package: LabelClockKit
        product: LabelClockKit
      - package: DelayCurveKit
        product: DelayCurveShape
      - package: SpotlightRAGKit
        product: SpotlightRAG
      - package: EvalHarnessKit
        product: EvalHarness

  AIChatAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AIChatAppTests
    dependencies:
      - target: AIChatApp
      - package: SnapshotTesting
        product: SnapshotTesting
      - package: SnapshotTesting
        product: InlineSnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajatslakhina.aichatapp.tests
        GENERATE_INFOPLIST_FILE: YES

  AIChatAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AIChatAppUITests
    dependencies:
      - target: AIChatApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajatslakhina.aichatapp.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AIChatApp:
    build:
      targets:
        AIChatApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - AIChatApp
      targets:
        - AIChatAppTests
        - AIChatAppUITests
    archive:
      config: Release
